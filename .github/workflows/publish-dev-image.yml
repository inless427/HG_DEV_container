name: Publish development image

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.devcontainer/Dockerfile'
      - '.devcontainer/Dockerfile.dockerignore'
      - '.github/workflows/publish-dev-image.yml'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev-image-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    # latest 仅从默认分支发布；手动运行也请选择默认分支。
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Compute image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}-dev"
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build amd64 image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64
          load: true
          tags: honeyghost-dev:check
          cache-from: type=gha,scope=honeyghost-dev
          cache-to: type=gha,mode=max,scope=honeyghost-dev

      - name: Verify development user and tools
        run: |
          docker run --rm honeyghost-dev:check bash -lc '
            set -eu
            test "$(id -un)" = dev
            test -w "$HOME/go/pkg/mod"
            test -w "$HOME/.cache/go-build"
            go version
            g++ --version
            clang --version
            clangd-19 --version
            cmake --version
            bpftool version
            protoc --version
            pkg-config --exists libbpf libsystemd protobuf
          '

      - name: Build and publish multi-platform image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .devcontainer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=HoneyGhost development toolchain
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=honeyghost-dev
          cache-to: type=gha,mode=max,scope=honeyghost-dev

      - name: Show pull command
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          {
            echo '### Development image published'
            echo
            echo '```sh'
            echo "docker pull $IMAGE_NAME:latest"
            echo "docker pull $IMAGE_NAME@$IMAGE_DIGEST"
            echo '```'
            echo
            echo "Set devcontainer.json image to: $IMAGE_NAME:latest"
          } >> "$GITHUB_STEP_SUMMARY"
